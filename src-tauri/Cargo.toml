[package]
name = "agente-pedro"
version = "0.1.0"
description = "Agente Pedro - Desktop Life OS"
authors = ["Pedro Henrique"]
edition = "2021"

[lib]
name = "agente_pedro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-sql = { version = "2.2", features = ["sqlite"] }
tauri-plugin-global-shortcut = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
